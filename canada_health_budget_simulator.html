<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canada Health Budget Simulator - Facilitation Tool</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & ReactDOM 18 CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone for JSX transformation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Recharts & Prop-Types CDNs for dynamic charting -->
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js"></script>

  <!-- Inter Font -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;
    const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer } = Recharts;

    const TOTAL_BUDGET_TEN_YEARS = 500; // $500B CAD Total over 10 years

    // Baseline Year 0 Metrics before investments
    const BASELINE_METRICS = {
      erWaitHours: 20.5,
      familyDoctorWaitMonths: 32.0,
      bedBlockPct: 24.5,
      physicianBurnoutPct: 72.0,
      systemStability: 38,
      publicApprovalPct: 28,
    };

    // Optimal Allocation Benchmark ($500B Total)
    const OPTIMAL_ALLOCATION = {
      postEr: 175,    // 35% - Post-Acute/LTC
      complex: 125,   // 25% - Preventative Complex Care
      doctors: 125,   // 25% - Doctor Shortage & Primary Care
      hospital: 75    // 15% - Hospital Space & Acute Beds
    };

    // Main App Component
    function App() {
      // Input State
      const [teamName, setTeamName] = useState('Team 1');
      const [allocation, setAllocation] = useState({
        doctors: 125,
        hospital: 125,
        complex: 125,
        postEr: 125
      });

      // Workflow & Leaderboard State
      const [view, setView] = useState('input'); // 'input' | 'report'
      const [teamsList, setTeamsList] = useState([]);
      const [activeReportIndex, setActiveReportIndex] = useState(null);
      const [showOptimalModal, setShowOptimalModal] = useState(false);

      // Remaining unallocated budget check
      const allocatedTotal = useMemo(() => {
        return Object.values(allocation).reduce((acc, curr) => acc + Number(curr), 0);
      }, [allocation]);

      const remainingBudget = useMemo(() => {
        return Number((TOTAL_BUDGET_TEN_YEARS - allocatedTotal).toFixed(1));
      }, [allocatedTotal]);

      // Handle Slider Inputs
      const handleSliderChange = (key, value) => {
        const numVal = parseFloat(value) || 0;
        const otherKeys = Object.keys(allocation).filter(k => k !== key);
        const otherSum = otherKeys.reduce((sum, k) => sum + allocation[k], 0);

        let newAlloc = { ...allocation, [key]: numVal };

        if (numVal + otherSum > TOTAL_BUDGET_TEN_YEARS) {
          const allowed = TOTAL_BUDGET_TEN_YEARS - otherSum;
          newAlloc[key] = Math.max(0, Number(allowed.toFixed(1)));
        }

        setAllocation(newAlloc);
      };

      // Set Preset Allocations
      const applyPreset = (type) => {
        if (type === 'equal') {
          setAllocation({ doctors: 125, hospital: 125, complex: 125, postEr: 125 });
        } else if (type === 'optimal') {
          setAllocation({ ...OPTIMAL_ALLOCATION });
        } else if (type === 'acute') {
          setAllocation({ doctors: 100, hospital: 225, complex: 75, postEr: 100 });
        }
      };

      // 10-Year Simulation Engine
      const runTenYearSimulation = () => {
        const pDocs = allocation.doctors / TOTAL_BUDGET_TEN_YEARS;
        const pHosp = allocation.hospital / TOTAL_BUDGET_TEN_YEARS;
        const pComp = allocation.complex / TOTAL_BUDGET_TEN_YEARS;
        const pPost = allocation.postEr / TOTAL_BUDGET_TEN_YEARS;

        let yearByYearData = [];
        let cur = { ...BASELINE_METRICS };

        for (let yr = 1; yr <= 10; yr++) {
          // 1. Post-ER Care Impact (Clears ALC beds directly)
          const alcRelief = (pPost * 22.0) + (yr * 0.3 * pPost);
          cur.bedBlockPct = Math.max(4.0, Number((BASELINE_METRICS.bedBlockPct - alcRelief + (yr * 0.25)).toFixed(1)));

          // 2. Acute Hospital Space Impact (Doubly effective when bed-blocking is low)
          const acuteEfficiency = Math.max(0.3, 1 - (cur.bedBlockPct / 40.0));
          const acuteImpact = (pHosp * 26.0) * acuteEfficiency;

          // 3. Complex Care Impact (Upstream deflection of high utilizers)
          const complexDeflection = (pComp * 18.0);

          // 4. Doctor Shortage Impact (Compounding recruitment over 10 years)
          const doctorTrainingLag = yr <= 2 ? 0.4 : 1.0;
          const doctorImpact = (pDocs * 30.0 * doctorTrainingLag) + (yr * 0.4 * pDocs);
          cur.familyDoctorWaitMonths = Math.max(1.5, Number((BASELINE_METRICS.familyDoctorWaitMonths - doctorImpact + (yr * 0.2)).toFixed(1)));
          cur.physicianBurnoutPct = Math.max(15.0, Number((BASELINE_METRICS.physicianBurnoutPct - (pDocs * 45.0) - (pComp * 10.0)).toFixed(1)));

          // Composite ER Wait Time Calculation
          const erPressure = (cur.bedBlockPct * 0.45) + (cur.familyDoctorWaitMonths * 0.25) - acuteImpact - complexDeflection;
          cur.erWaitHours = Math.max(1.5, Number((BASELINE_METRICS.erWaitHours + erPressure - (pPost * 8.0)).toFixed(1)));

          // System Stability & Public Approval Scoring
          const stabilityScore = Math.min(100, Math.max(0, Math.round(
            100 - (cur.erWaitHours * 2.2) - (cur.familyDoctorWaitMonths * 1.1) - (cur.bedBlockPct * 1.3) - (cur.physicianBurnoutPct * 0.25)
          )));

          cur.systemStability = stabilityScore;
          cur.publicApprovalPct = Math.min(98, Math.max(10, Math.round(
            30 + (stabilityScore * 0.65) - (remainingBudget > 5 ? 5 : 0)
          )));

          yearByYearData.push({
            year: `Year ${yr}`,
            erWaitHours: cur.erWaitHours,
            familyDoctorWaitMonths: cur.familyDoctorWaitMonths,
            bedBlockPct: cur.bedBlockPct,
            physicianBurnoutPct: cur.physicianBurnoutPct,
            systemStability: cur.systemStability,
            publicApprovalPct: cur.publicApprovalPct
          });
        }

        const finalStability = yearByYearData[9].systemStability;
        let letterGrade = 'F';
        if (finalStability >= 80) letterGrade = 'S';
        else if (finalStability >= 70) letterGrade = 'A';
        else if (finalStability >= 55) letterGrade = 'B';
        else if (finalStability >= 40) letterGrade = 'C';
        else if (finalStability >= 25) letterGrade = 'D';

        // Generate Audit Key Findings
        let auditFindings = [];
        if (pPost < 0.25) {
          auditFindings.push("CRITICAL BOTTLENECK: Underfunding Post-ER/LTC facilities left acute beds locked by ALC patients, neutralizing hospital investments.");
        } else {
          auditFindings.push("HIGH EFFICIENCY: Strong Post-ER investments unblocked acute beds, allowing ER wait times to plummet.");
        }

        if (pDocs < 0.20) {
          auditFindings.push("PRIMARY CARE STRAIN: Insufficient doctor funding caused GP waitlists and physician burnout to remain elevated.");
        } else {
          auditFindings.push("COMPOUNDING GP SUCCESS: Sustained doctor funding significantly expanded family care access over the decade.");
        }

        if (pHosp > 0.35 && pPost < 0.20) {
          auditFindings.push("CAPITAL TRAP: Excessive acute space funding without post-ER capacity created expensive beds that immediately filled with non-acute patients.");
        }

        const newTeamEntry = {
          id: Date.now(),
          name: teamName || `Team ${teamsList.length + 1}`,
          allocation: { ...allocation },
          finalMetrics: yearByYearData[9],
          letterGrade,
          score: finalStability,
          yearlyHistory: yearByYearData,
          auditFindings
        };

        const updatedTeams = [...teamsList, newTeamEntry];
        setTeamsList(updatedTeams);
        setActiveReportIndex(updatedTeams.length - 1);
        setView('report');
      };

      // Reset to enter a new team
      const handleNewTeamEntry = () => {
        setTeamName(`Team ${teamsList.length + 1}`);
        setAllocation({ doctors: 125, hospital: 125, complex: 125, postEr: 125 });
        setView('input');
      };

      const currentReport = activeReportIndex !== null ? teamsList[activeReportIndex] : null;

      return (
        <div className="flex flex-col min-h-screen">
          
          {/* Header Bar */}
          <header className="bg-slate-900 text-white border-b-4 border-red-600 sticky top-0 z-40 shadow-md">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="bg-red-600 text-white p-2 rounded-lg shadow">
                  <svg className="w-6 h-6 fill-current" viewBox="0 0 24 24">
                    <path d="M12 2l1.8 3.6 4-.6-2.4 3.3 2.8 3-4-.5L12 15l-2.2-4.2-4 .5 2.8-3-2.4-3.3 4 .6z" />
                    <path d="M12 15v7" stroke="currentColor" strokeWidth="2" strokeLinecap="round" />
                  </svg>
                </div>
                <div>
                  <div className="text-[10px] font-bold uppercase tracking-widest text-red-400">Government of Canada • Tutorial Facilitation Tool</div>
                  <h1 className="text-base sm:text-lg font-extrabold text-white">10-Year Health Budget Simulator</h1>
                </div>
              </div>

              <div className="flex items-center gap-3">
                {/* Secret Facilitator Benchmark Button */}
                <button
                  onClick={() => setShowOptimalModal(true)}
                  className="bg-slate-800 hover:bg-slate-700 text-amber-300 border border-amber-500/40 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 shadow"
                >
                  <svg className="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                  </svg>
                  Reveal Optimal System
                </button>

                {view === 'report' && (
                  <button
                    onClick={handleNewTeamEntry}
                    className="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition"
                  >
                    + Test Another Team
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* Main Content Area */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">

            {/* SCREEN 1: TEAM INPUT & BUDGET ALLOCATION */}
            {view === 'input' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                
                {/* Left Info & Instructions Panel */}
                <div className="lg:col-span-5 space-y-5">
                  
                  <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-3">
                    <div className="text-xs font-bold text-red-600 uppercase tracking-wider">Tutorial Facilitation Mandate</div>
                    <h2 className="text-xl font-black text-slate-900">10-Year Health Allocation ($500 Billion CAD)</h2>
                    <p className="text-xs text-slate-600 leading-relaxed">
                      Instruct each team to allocate their $500 Billion 10-year budget across the four key systemic bottlenecks. Once decided, run the 10-year simulation engine to instantly view their Auditor General Report Card and rank them on the leaderboard.
                    </p>
                  </div>

                  {/* Team Name Input */}
                  <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-2">
                    <label className="text-xs font-bold text-slate-700 uppercase tracking-wider">Group / Team Name</label>
                    <input
                      type="text"
                      value={teamName}
                      onChange={(e) => setTeamName(e.target.value)}
                      placeholder="e.g. Group A - Healthcare Reformers"
                      className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm font-semibold text-slate-900 focus:ring-2 focus:ring-red-500 focus:outline-none"
                    />
                  </div>

                  {/* Presets for quick demonstration */}
                  <div className="bg-slate-900 text-white p-4 rounded-xl space-y-2 text-xs">
                    <div className="font-bold text-slate-300 uppercase tracking-wider">Quick Preset Benchmarks:</div>
                    <div className="flex gap-2 flex-wrap">
                      <button onClick={() => applyPreset('equal')} className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-200 border border-slate-700">Equal Split ($125B each)</button>
                      <button onClick={() => applyPreset('acute')} className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-200 border border-slate-700">Acute Heavy ($225B Hospital)</button>
                    </div>
                  </div>

                </div>

                {/* Right Allocation Sliders Panel */}
                <div className="lg:col-span-7 bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-5">
                  
                  <div className="flex items-center justify-between pb-4 border-b border-slate-100">
                    <div>
                      <h3 className="text-base font-bold text-slate-900">10-Year Allocation Envelope</h3>
                      <p className="text-xs text-slate-500">Allocate $500B total across the 4 issues</p>
                    </div>
                    <div className="text-right bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200">
                      <div className="text-[10px] text-slate-500 uppercase font-bold">Unallocated</div>
                      <div className={`text-lg font-black ${remainingBudget < 0 ? 'text-red-600' : 'text-slate-900'}`}>
                        ${remainingBudget.toFixed(1)}B <span className="text-xs font-normal text-slate-500">/ $500B</span>
                      </div>
                    </div>
                  </div>

                  {/* Slider 1: Doctor Shortage */}
                  <div className="p-3.5 bg-amber-50/50 border border-amber-100 rounded-xl space-y-1.5">
                    <div className="flex justify-between items-center text-xs font-bold text-slate-900">
                      <span>1. Doctor Shortage & Primary Care</span>
                      <span className="text-amber-700 text-sm">${allocation.doctors.toFixed(1)} Billion</span>
                    </div>
                    <p className="text-[11px] text-slate-600">Medical school slots, GP retention, international licensing pipelines.</p>
                    <input
                      type="range" min="0" max={TOTAL_BUDGET_TEN_YEARS} step="5"
                      value={allocation.doctors}
                      onChange={(e) => handleSliderChange('doctors', e.target.value)}
                      className="w-full accent-amber-600 cursor-pointer"
                    />
                  </div>

                  {/* Slider 2: Hospital Space */}
                  <div className="p-3.5 bg-red-50/50 border border-red-100 rounded-xl space-y-1.5">
                    <div className="flex justify-between items-center text-xs font-bold text-slate-900">
                      <span>2. Lack of Hospital Space & Acute Beds</span>
                      <span className="text-red-700 text-sm">${allocation.hospital.toFixed(1)} Billion</span>
                    </div>
                    <p className="text-[11px] text-slate-600">Physical ER additions, acute ICU capacity, surgical trauma Wards.</p>
                    <input
                      type="range" min="0" max={TOTAL_BUDGET_TEN_YEARS} step="5"
                      value={allocation.hospital}
                      onChange={(e) => handleSliderChange('hospital', e.target.value)}
                      className="w-full accent-red-600 cursor-pointer"
                    />
                  </div>

                  {/* Slider 3: Complex Patients */}
                  <div className="p-3.5 bg-blue-50/50 border border-blue-100 rounded-xl space-y-1.5">
                    <div className="flex justify-between items-center text-xs font-bold text-slate-900">
                      <span>3. Inability to Control Medically Complex Patients</span>
                      <span className="text-blue-700 text-sm">${allocation.complex.toFixed(1)} Billion</span>
                    </div>
                    <p className="text-[11px] text-slate-600">Specialized community geriatric teams, multi-morbidity preventative care.</p>
                    <input
                      type="range" min="0" max={TOTAL_BUDGET_TEN_YEARS} step="5"
                      value={allocation.complex}
                      onChange={(e) => handleSliderChange('complex', e.target.value)}
                      className="w-full accent-blue-600 cursor-pointer"
                    />
                  </div>

                  {/* Slider 4: Post-ER Facilities */}
                  <div className="p-3.5 bg-emerald-50/50 border border-emerald-100 rounded-xl space-y-1.5">
                    <div className="flex justify-between items-center text-xs font-bold text-slate-900">
                      <span>4. Lack of Places to Go After Leaving ER (Post-Acute/LTC)</span>
                      <span className="text-emerald-700 text-sm">${allocation.postEr.toFixed(1)} Billion</span>
                    </div>
                    <p className="text-[11px] text-slate-600">Long-term care beds, rehabilitation facilities to stop ALC 'bed blocking'.</p>
                    <input
                      type="range" min="0" max={TOTAL_BUDGET_TEN_YEARS} step="5"
                      value={allocation.postEr}
                      onChange={(e) => handleSliderChange('postEr', e.target.value)}
                      className="w-full accent-emerald-600 cursor-pointer"
                    />
                  </div>

                  {/* Action Button */}
                  <button
                    onClick={runTenYearSimulation}
                    className="w-full py-4 bg-red-600 hover:bg-red-700 text-white font-extrabold rounded-xl shadow-lg shadow-red-600/20 text-base transition"
                  >
                    Run 10-Year Simulation & Generate Audit Report →
                  </button>

                </div>

              </div>
            )}

            {/* SCREEN 2: AUDITOR GENERAL REPORT & LEADERBOARD */}
            {view === 'report' && currentReport && (
              <div className="space-y-6">
                
                {/* Leaderboard Selection Bar */}
                {teamsList.length > 0 && (
                  <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between gap-4 overflow-x-auto">
                    <span className="text-xs font-bold text-slate-500 uppercase tracking-wider shrink-0">Class Leaderboard:</span>
                    <div className="flex items-center gap-2 overflow-x-auto py-1">
                      {teamsList.map((tm, idx) => (
                        <button
                          key={tm.id}
                          onClick={() => setActiveReportIndex(idx)}
                          className={`px-3 py-1.5 rounded-lg text-xs font-bold border transition shrink-0 ${
                            activeReportIndex === idx
                              ? 'bg-slate-900 text-white border-slate-900'
                              : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                          }`}
                        >
                          {tm.name} ({tm.score} pts - {tm.letterGrade})
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                {/* Main Audit Card */}
                <div className="bg-white p-6 sm:p-8 rounded-xl border border-slate-200 shadow-sm space-y-6">
                  
                  {/* Report Header */}
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between border-b border-slate-200 pb-6 gap-4">
                    <div>
                      <div className="text-xs font-bold uppercase tracking-wider text-red-600">Office of the Auditor General of Canada</div>
                      <h2 className="text-2xl font-black text-slate-900">10-Year Performance Audit: {currentReport.name}</h2>
                      <p className="text-xs text-slate-500 mt-1">Total Allocated: $500 Billion CAD over 10 Years</p>
                    </div>

                    <div className="flex items-center gap-4 bg-slate-50 px-5 py-3 rounded-xl border border-slate-200">
                      <div className="text-right">
                        <div className="text-[10px] font-bold uppercase text-slate-500">System Score</div>
                        <div className="text-2xl font-black text-slate-900">{currentReport.score} / 100</div>
                      </div>
                      <div className={`w-14 h-14 rounded-xl flex items-center justify-center text-3xl font-black text-white ${
                        currentReport.letterGrade === 'S' || currentReport.letterGrade === 'A' ? 'bg-emerald-600' :
                        currentReport.letterGrade === 'B' || currentReport.letterGrade === 'C' ? 'bg-amber-500' : 'bg-red-600'
                      }`}>
                        {currentReport.letterGrade}
                      </div>
                    </div>
                  </div>

                  {/* Allocated Breakdown Summary Cards */}
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <div className="p-3 bg-amber-50 rounded-lg border border-amber-100 text-center">
                      <div className="text-[10px] font-bold text-amber-800">1. Doctors</div>
                      <div className="text-base font-black text-amber-900">${currentReport.allocation.doctors}B</div>
                    </div>
                    <div className="p-3 bg-red-50 rounded-lg border border-red-100 text-center">
                      <div className="text-[10px] font-bold text-red-800">2. Hospital Space</div>
                      <div className="text-base font-black text-red-900">${currentReport.allocation.hospital}B</div>
                    </div>
                    <div className="p-3 bg-blue-50 rounded-lg border border-blue-100 text-center">
                      <div className="text-[10px] font-bold text-blue-800">3. Complex Care</div>
                      <div className="text-base font-black text-blue-900">${currentReport.allocation.complex}B</div>
                    </div>
                    <div className="p-3 bg-emerald-50 rounded-lg border border-emerald-100 text-center">
                      <div className="text-[10px] font-bold text-emerald-800">4. Post-ER Care</div>
                      <div className="text-base font-black text-emerald-900">${currentReport.allocation.postEr}B</div>
                    </div>
                  </div>

                  {/* Key End-of-Decade Health Outcomes */}
                  <div className="space-y-3">
                    <h3 className="text-sm font-bold text-slate-900 uppercase tracking-wider">Decade-End System Impact (Year 10 Metrics)</h3>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                      
                      <div className="p-4 bg-slate-50 rounded-xl border border-slate-200">
                        <div className="text-xs text-slate-500">ER Wait Times</div>
                        <div className="text-2xl font-black text-slate-900">{currentReport.finalMetrics.erWaitHours} <span className="text-xs font-normal">hrs</span></div>
                        <div className="text-[10px] text-slate-400">Baseline: 20.5 hrs</div>
                      </div>

                      <div className="p-4 bg-slate-50 rounded-xl border border-slate-200">
                        <div className="text-xs text-slate-500">GP Waitlist</div>
                        <div className="text-2xl font-black text-slate-900">{currentReport.finalMetrics.familyDoctorWaitMonths} <span className="text-xs font-normal">mos</span></div>
                        <div className="text-[10px] text-slate-400">Baseline: 32.0 mos</div>
                      </div>

                      <div className="p-4 bg-slate-50 rounded-xl border border-slate-200">
                        <div className="text-xs text-slate-500">Bed Blocking (ALC)</div>
                        <div className="text-2xl font-black text-slate-900">{currentReport.finalMetrics.bedBlockPct}%</div>
                        <div className="text-[10px] text-slate-400">Baseline: 24.5%</div>
                      </div>

                      <div className="p-4 bg-slate-50 rounded-xl border border-slate-200">
                        <div className="text-xs text-slate-500">Physician Burnout</div>
                        <div className="text-2xl font-black text-slate-900">{currentReport.finalMetrics.physicianBurnoutPct}%</div>
                        <div className="text-[10px] text-slate-400">Baseline: 72.0%</div>
                      </div>

                    </div>
                  </div>

                  {/* Auditor General Audit Findings */}
                  <div className="space-y-3">
                    <h3 className="text-sm font-bold text-slate-900 uppercase tracking-wider">Auditor General Findings</h3>
                    <div className="space-y-2">
                      {currentReport.auditFindings.map((finding, idx) => (
                        <div key={idx} className="p-3 bg-slate-50 border-l-4 border-slate-800 rounded-r-lg text-xs font-semibold text-slate-800">
                          {finding}
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* 10-Year Trajectory Line Chart */}
                  <div className="space-y-3 pt-2">
                    <h3 className="text-sm font-bold text-slate-900 uppercase tracking-wider">10-Year Trajectory Chart</h3>
                    <div className="h-64 w-full bg-slate-50 p-2 rounded-xl border border-slate-200">
                      <ResponsiveContainer width="100%" height="100%">
                        <LineChart data={currentReport.yearlyHistory}>
                          <CartesianGrid strokeDasharray="3 3" stroke="#e2e8f0" />
                          <XAxis dataKey="year" stroke="#64748b" style={{ fontSize: '10px' }} />
                          <YAxis stroke="#64748b" style={{ fontSize: '10px' }} />
                          <Tooltip />
                          <Legend wrapperStyle={{ fontSize: '12px' }} />
                          <Line type="monotone" dataKey="erWaitHours" name="ER Wait (Hours)" stroke="#dc2626" strokeWidth={2} />
                          <Line type="monotone" dataKey="familyDoctorWaitMonths" name="GP Wait (Months)" stroke="#d97706" strokeWidth={2} />
                          <Line type="monotone" dataKey="systemStability" name="System Stability (0-100)" stroke="#16a34a" strokeWidth={2.5} />
                        </LineChart>
                      </ResponsiveContainer>
                    </div>
                  </div>

                </div>

              </div>
            )}

          </main>

          {}
          {/* Facilitator Optimal System Modal */}
          {showOptimalModal && (
            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white max-w-2xl w-full rounded-2xl shadow-2xl border border-slate-200 p-6 space-y-5 max-h-[90vh] overflow-y-auto">
                
                <div className="flex items-center justify-between border-b border-slate-200 pb-3">
                  <div className="flex items-center gap-2">
                    <span className="bg-amber-100 text-amber-800 px-2 py-0.5 rounded text-xs font-bold">FACILITATOR ONLY</span>
                    <h3 className="text-lg font-black text-slate-900">Optimal 10-Year System Benchmark</h3>
                  </div>
                  <button 
                    onClick={() => setShowOptimalModal(false)}
                    className="text-slate-400 hover:text-slate-600 font-bold text-lg"
                  >
                    ✕
                  </button>
                </div>

                {/* Breakdown Grid */}
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                  <div className="p-3 bg-emerald-50 border border-emerald-200 rounded-lg text-center">
                    <div className="text-[10px] font-bold text-emerald-800">4. Post-ER Care</div>
                    <div className="text-xl font-black text-emerald-900">$175B</div>
                    <div className="text-[10px] text-emerald-700 font-bold">35% Allocation</div>
                  </div>
                  <div className="p-3 bg-blue-50 border border-blue-200 rounded-lg text-center">
                    <div className="text-[10px] font-bold text-blue-800">3. Complex Care</div>
                    <div className="text-xl font-black text-blue-900">$125B</div>
                    <div className="text-[10px] text-blue-700 font-bold">25% Allocation</div>
                  </div>
                  <div className="p-3 bg-amber-50 border border-amber-200 rounded-lg text-center">
                    <div className="text-[10px] font-bold text-amber-800">1. Doctors</div>
                    <div className="text-xl font-black text-amber-900">$125B</div>
                    <div className="text-[10px] text-amber-700 font-bold">25% Allocation</div>
                  </div>
                  <div className="p-3 bg-red-50 border border-red-200 rounded-lg text-center">
                    <div className="text-[10px] font-bold text-red-800">2. Hospital Space</div>
                    <div className="text-xl font-black text-red-900">$75B</div>
                    <div className="text-[10px] text-red-700 font-bold">15% Allocation</div>
                  </div>
                </div>

                {/* Facilitator Rationales */}
                <div className="space-y-3 text-xs text-slate-700 leading-relaxed">
                  <h4 className="font-bold text-slate-900 text-sm">Why This Strategy Yields Score 90+ (Grade S):</h4>
                  
                  <div className="p-3 bg-slate-50 rounded-lg border border-slate-200 space-y-1">
                    <span className="font-bold text-slate-900">1. Unblocking Alternate Level of Care (ALC):</span>
                    <p>Up to 25% of hospital beds are occupied by patients who belong in long-term/post-acute care. Investing 35% in Post-ER Care frees existing acute hospital beds at a fraction of the price of building new hospital wards.</p>
                  </div>

                  <div className="p-3 bg-slate-50 rounded-lg border border-slate-200 space-y-1">
                    <span className="font-bold text-slate-900">2. Upstream Deflection of Complex Patients:</span>
                    <p>A small core of complex chronic patients accounts for a disproportionate share of ER visits. 25% funding for proactive community care prevents crises before they arrive at the ER.</p>
                  </div>

                  <div className="p-3 bg-slate-50 rounded-lg border border-slate-200 space-y-1">
                    <span className="font-bold text-slate-900">3. Avoiding the "Acute-Care Infrastructure Trap":</span>
                    <p>Building new acute hospital space without fixing post-ER discharge options results in expensive new hospital beds that immediately get clogged with ALC patients. 15% maintains acute space while letting post-acute care do the heavy lifting.</p>
                  </div>
                </div>

                <div className="pt-2 flex justify-between items-center border-t border-slate-200">
                  <button
                    onClick={() => {
                      applyPreset('optimal');
                      setShowOptimalModal(false);
                    }}
                    className="px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-lg text-xs transition"
                  >
                    Auto-Fill Optimal Allocation
                  </button>

                  <button
                    onClick={() => setShowOptimalModal(false)}
                    className="px-4 py-1.5 bg-slate-900 text-white font-bold rounded-lg text-xs hover:bg-slate-800 transition"
                  >
                    Close Benchmark
                  </button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    // Render React Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
