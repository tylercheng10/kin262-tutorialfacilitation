<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Canada Health Budget Simulator: 10-Year Strategy</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Recharts CDN -->
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;
    const { 
      LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, RadarChart, PolarGrid, PolarAngleAxis, PolarRadiusAxis, Radar 
    } = window.Recharts;

    const TOTAL_BUDGET = 500; // $500 Billion over 10 years

    const ISSUES = [
      {
        id: 'doctors',
        title: 'Doctor Shortage & Primary Care',
        icon: '👨‍⚕️',
        desc: 'Family doctors, GP access, training seats, IMG integration, and primary care infrastructure.',
        optimal: 125,
      },
      {
        id: 'beds',
        title: 'Lack of Hospital Space (Acute Care)',
        icon: '🏥',
        desc: 'Hospital wings, acute beds, surgical suites, and ER physical expansion.',
        optimal: 75,
      },
      {
        id: 'complex',
        title: 'Inability to Control Medically Complex Patients',
        icon: '🩺',
        desc: 'Outpatient chronic care management, community health teams, home monitoring, and preventive care.',
        optimal: 125,
      },
      {
        id: 'post_er',
        title: 'Lack of Places to Go After Leaving ER (Post-Acute / LTC)',
        icon: '🏡',
        desc: 'Long-term care (LTC), rehab facilities, home care support, and ALC bed liberation.',
        optimal: 175,
      }
    ];

    // Engine to simulate 10 years
    function runSimulation(allocations) {
      const doc = allocations.doctors || 0;
      const beds = allocations.beds || 0;
      const comp = allocations.complex || 0;
      const post = allocations.post_er || 0;

      // Synergy calculations
      const alcReduction = post * 0.45; 
      const effectiveBedBoost = beds * 0.25 + alcReduction * 0.8; 
      const complexDeflection = comp * 0.55; 
      const primaryCareStrength = doc * 0.5; 

      // Year-by-year modeling
      const trajectory = [];
      let baseWait = 11.5; // Hours in ER
      let baseBedOccupancy = 98; // %
      let baseBurnout = 88; // %
      let baseAlcRate = 22; // % Bed blocking
      let baseApproval = 34; // %

      for (let yr = 0; yr <= 10; yr++) {
        const docImpact = (primaryCareStrength / 10) * Math.min(1, yr / 3); 
        const bedImpact = (effectiveBedBoost / 10) * Math.min(1, yr / 2);
        const compImpact = (complexDeflection / 10) * Math.min(1, yr / 2);
        const alcImpact = (alcReduction / 10) * Math.min(1, yr / 1.5);

        const erWait = Math.max(1.5, baseWait - (docImpact * 0.15 + bedImpact * 0.2 + compImpact * 0.25 + alcImpact * 0.3));
        const alcRate = Math.max(3, baseAlcRate - alcImpact * 0.7);
        const bedOcc = Math.max(70, baseBedOccupancy - (bedImpact * 0.2 + alcImpact * 0.5));
        const burnout = Math.max(25, baseBurnout - (docImpact * 0.4 + alcImpact * 0.25 + bedImpact * 0.15));
        const approval = Math.min(95, Math.max(10, baseApproval + (11.5 - erWait) * 4.2 + (88 - burnout) * 0.3));

        const systemHealth = Math.round(
          Math.max(0, Math.min(100, 
            100 - (erWait * 3.5) - (alcRate * 1.2) - (burnout * 0.3) + (approval * 0.3)
          ))
        );

        trajectory.push({
          year: `Yr ${yr}`,
          erWait: parseFloat(erWait.toFixed(1)),
          alcRate: parseFloat(alcRate.toFixed(1)),
          bedOcc: parseFloat(bedOcc.toFixed(1)),
          burnout: parseFloat(burnout.toFixed(1)),
          approval: parseFloat(approval.toFixed(1)),
          systemHealth
        });
      }

      const finalYr = trajectory[10];
      const overallScore = finalYr.systemHealth;

      let grade = 'F';
      if (overallScore >= 85) grade = 'S';
      else if (overallScore >= 75) grade = 'A';
      else if (overallScore >= 62) grade = 'B';
      else if (overallScore >= 50) grade = 'C';
      else if (overallScore >= 38) grade = 'D';

      return {
        trajectory,
        finalYr,
        overallScore,
        grade,
        insights: generateAuditFindings(allocations, finalYr)
      };
    }

    function generateAuditFindings(alloc, finalYr) {
      const findings = [];
      
      if (alloc.post_er >= 150) {
        findings.push({
          type: 'positive',
          title: 'Mastery of ALC Bottleneck',
          desc: 'By heavily funding post-acute and long-term care facilities, you successfully liberated acute hospital beds from "bed-blocking", creating massive ER relief at a fraction of the price of hospital construction.'
        });
      } else if (alloc.post_er < 80) {
        findings.push({
          type: 'critical',
          title: 'Unaddressed Gridlock (ALC Crisis)',
          desc: 'Underfunding post-ER care meant patients ready for discharge remained trapped in acute hospital beds. This bottleneck choked ER throughput regardless of other spending.'
        });
      }

      if (alloc.beds >= 180) {
        findings.push({
          type: 'warning',
          title: 'Over-Capitalization of Acute Infrastructure',
          desc: 'Investing heavily in physical hospital beds without fixing post-acute care created expensive acute capacity that was quickly absorbed by chronic overflow.'
        });
      }

      if (alloc.complex >= 100) {
        findings.push({
          type: 'positive',
          title: 'Upstream Deflection Success',
          desc: 'Investing in complex chronic care management prevented fragile patients from deteriorating into ER crises, reducing unnecessary emergency room visits.'
        });
      }

      if (alloc.doctors >= 100) {
        findings.push({
          type: 'positive',
          title: 'Long-term Primary Care Resilience',
          desc: 'Substantial GP and primary care funding yielded powerful compounding improvements in physician retention and patient preventative screening by Year 10.'
        });
      } else {
        findings.push({
          type: 'critical',
          title: 'Primary Care Attrition',
          desc: 'Insufficient investment in primary doctors left millions without family physicians, driving unmanaged chronic conditions directly into emergency rooms.'
        });
      }

      return findings;
    }

    function App() {
      const [groups, setGroups] = useState([]);
      const [currentGroupIdx, setCurrentGroupIdx] = useState(null);
      
      // Form state
      const [teamName, setTeamName] = useState('');
      const [allocations, setAllocations] = useState({
        doctors: 125,
        beds: 125,
        complex: 125,
        post_er: 125
      });
      const [showOptimalModal, setShowOptimalModal] = useState(false);

      const allocatedTotal = useMemo(() => {
        return Object.values(allocations).reduce((a, b) => a + Number(b), 0);
      }, [allocations]);

      const remainingBudget = TOTAL_BUDGET - allocatedTotal;

      const handleSliderChange = (id, val) => {
        const numVal = Number(val);
        setAllocations(prev => ({
          ...prev,
          [id]: numVal
        }));
      };

      const handlePreset = (presetAlloc) => {
        setAllocations({
          doctors: presetAlloc[0],
          beds: presetAlloc[1],
          complex: presetAlloc[2],
          post_er: presetAlloc[3]
        });
      };

      const handleRunSimulation = (e) => {
        e.preventDefault();
        const name = teamName.trim() || `Group ${groups.length + 1}`;
        const result = runSimulation(allocations);
        
        const newGroupEntry = {
          id: Date.now(),
          name,
          allocations: { ...allocations },
          result,
          timestamp: new Date().toLocaleTimeString()
        };

        const updatedGroups = [...groups, newGroupEntry];
        setGroups(updatedGroups);
        setCurrentGroupIdx(updatedGroups.length - 1);
        setTeamName('');
      };

      const activeGroup = currentGroupIdx !== null ? groups[currentGroupIdx] : null;

      // Sorted leaderboard
      const leaderboard = useMemo(() => {
        return [...groups].sort((a, b) => b.result.overallScore - a.result.overallScore);
      }, [groups]);

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col">
          {/* Header */}
          <header className="bg-slate-950 border-b border-slate-800 p-4 sticky top-0 z-30 shadow-md">
            <div className="max-w-7xl mx-mx-auto flex flex-wrap justify-between items-center gap-4 px-4">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded bg-red-600 flex items-center justify-center font-bold text-lg text-white shadow-lg">
                  🍁
                </div>
                <div>
                  <h1 className="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                    Canada Health Budget Simulator 
                    <span className="text-xs bg-red-950 text-red-300 border border-red-800 px-2 py-0.5 rounded-full font-mono">
                      10-YEAR FACILITATION TOOL
                    </span>
                  </h1>
                  <p className="text-xs text-slate-400">Federal/Provincial Healthcare Investment Strategy Model ($500B Total)</p>
                </div>
              </div>

              <div className="flex items-center gap-3">
                {/* Secret Reveal Optimal Button */}
                <button
                  onClick={() => setShowOptimalModal(true)}
                  className="bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold px-3 py-1.5 rounded-lg text-xs flex items-center gap-1.5 transition shadow"
                >
                  <span>💡</span> Reveal Benchmark Optimal
                </button>

                {groups.length > 0 && (
                  <button
                    onClick={() => setCurrentGroupIdx(null)}
                    className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold transition"
                  >
                    + New Group Simulation
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* Main Layout */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            {/* Left Column: Group Input & Leaderboard */}
            <div className="lg:col-span-5 flex flex-col gap-6">
              
              {/* Allocation Card */}
              <div className="bg-slate-800/80 border border-slate-700/80 rounded-xl p-5 shadow-xl backdrop-blur-sm">
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-lg font-bold text-white flex items-center gap-2">
                    <span>📋</span> Team Strategy Entry
                  </h2>
                  <span className={`text-xs font-bold px-2.5 py-1 rounded-md border ${
                    remainingBudget === 0 
                      ? 'bg-emerald-950 text-emerald-300 border-emerald-800' 
                      : remainingBudget < 0 
                      ? 'bg-red-950 text-red-300 border-red-800' 
                      : 'bg-amber-950 text-amber-300 border-amber-800'
                  }`}>
                    {remainingBudget === 0 ? '✓ Fully Allocated' : remainingBudget < 0 ? `Over by $${Math.abs(remainingBudget)}B` : `$${remainingBudget}B Remaining`}
                  </span>
                </div>

                <form onSubmit={handleRunSimulation} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">Group / Team Name</label>
                    <input
                      type="text"
                      placeholder="e.g. Group 1 - Primary Care First"
                      value={teamName}
                      onChange={(e) => setTeamName(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500"
                    />
                  </div>

                  {/* Quick Presets */}
                  <div>
                    <span className="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Quick Presets</span>
                    <div className="grid grid-cols-3 gap-1.5">
                      <button
                        type="button"
                        onClick={() => handlePreset([125, 75, 125, 175])}
                        className="bg-slate-900 hover:bg-slate-700 text-slate-300 border border-slate-700 text-[11px] py-1 px-2 rounded font-medium transition text-center"
                      >
                        Optimal Strategy
                      </button>
                      <button
                        type="button"
                        onClick={() => handlePreset([0, 0, 0, 0])}
                        className="bg-slate-900 hover:bg-slate-700 text-slate-300 border border-slate-700 text-[11px] py-1 px-2 rounded font-medium transition text-center"
                      >
                        All $0B (Zero Funding)
                      </button>
                      <button
                        type="button"
                        onClick={() => handlePreset([125, 125, 125, 125])}
                        className="bg-slate-900 hover:bg-slate-700 text-slate-300 border border-slate-700 text-[11px] py-1 px-2 rounded font-medium transition text-center"
                      >
                        Balanced Equal
                      </button>
                    </div>
                  </div>

                  {/* Sliders */}
                  <div className="space-y-3 pt-2">
                    {ISSUES.map((issue) => (
                      <div key={issue.id} className="bg-slate-900/60 p-3 rounded-lg border border-slate-800">
                        <div className="flex justify-between items-center mb-1">
                          <label className="text-xs font-bold text-slate-200 flex items-center gap-1.5">
                            <span>{issue.icon}</span> {issue.title}
                          </label>
                          <span className="text-sm font-mono font-bold text-red-400">${allocations[issue.id]}B</span>
                        </div>
                        <input
                          type="range"
                          min="0"
                          max="300"
                          step="5"
                          value={allocations[issue.id]}
                          onChange={(e) => handleSliderChange(issue.id, e.target.value)}
                          className="w-full accent-red-500 bg-slate-700 h-1.5 rounded-lg cursor-pointer"
                        />
                        <p className="text-[11px] text-slate-400 mt-1 leading-snug">{issue.desc}</p>
                      </div>
                    ))}
                  </div>

                  <button
                    type="submit"
                    disabled={remainingBudget < 0}
                    className={`w-full py-3 rounded-lg font-bold text-sm transition shadow-lg flex items-center justify-center gap-2 ${
                      remainingBudget < 0
                        ? 'bg-slate-700 text-slate-400 cursor-not-allowed'
                        : 'bg-red-600 hover:bg-red-500 text-white shadow-red-950/50'
                    }`}
                  >
                    <span>🚀</span> Run 10-Year Simulation
                  </button>
                </form>
              </div>

              {/* Class Leaderboard */}
              {groups.length > 0 && (
                <div className="bg-slate-800/80 border border-slate-700/80 rounded-xl p-4 shadow-xl">
                  <h3 className="text-sm font-bold text-slate-200 mb-3 flex items-center gap-2">
                    <span>🏆</span> Class Leaderboard ({groups.length} Teams)
                  </h3>
                  <div className="space-y-2 max-h-64 overflow-y-auto pr-1">
                    {leaderboard.map((item, idx) => {
                      const isSelected = activeGroup && activeGroup.id === item.id;
                      return (
                        <div
                          key={item.id}
                          onClick={() => {
                            const originalIdx = groups.findIndex(g => g.id === item.id);
                            setCurrentGroupIdx(originalIdx);
                          }}
                          className={`p-2.5 rounded-lg border cursor-pointer transition flex justify-between items-center ${
                            isSelected 
                              ? 'bg-slate-700 border-red-500 text-white' 
                              : 'bg-slate-900/60 border-slate-800 hover:border-slate-700 text-slate-300'
                          }`}
                        >
                          <div className="flex items-center gap-2.5">
                            <span className={`w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold ${
                              idx === 0 ? 'bg-amber-500 text-slate-950' : idx === 1 ? 'bg-slate-300 text-slate-950' : idx === 2 ? 'bg-amber-800 text-amber-100' : 'bg-slate-800 text-slate-400'
                            }`}>
                              {idx + 1}
                            </span>
                            <div>
                              <div className="text-xs font-bold leading-none">{item.name}</div>
                              <div className="text-[10px] text-slate-400 mt-1">Grade: {item.result.grade}</div>
                            </div>
                          </div>

                          <div className="text-right">
                            <span className="text-sm font-mono font-bold text-emerald-400">{item.result.overallScore}</span>
                            <span className="text-[10px] text-slate-400">/100</span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

            </div>

            {/* Right Column: Simulation Report */}
            <div className="lg:col-span-7">
              {activeGroup ? (
                <div className="space-y-6">
                  {/* Executive Auditor General Banner */}
                  <div className="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl relative overflow-hidden">
                    <div className="flex flex-wrap justify-between items-start gap-4 mb-4">
                      <div>
                        <span className="text-xs font-bold uppercase tracking-wider text-red-400 bg-red-950/60 border border-red-900/60 px-2.5 py-1 rounded-md">
                          OFFICIAL AUDITOR GENERAL REPORT
                        </span>
                        <h2 className="text-2xl font-black text-white mt-2">{activeGroup.name}</h2>
                        <p className="text-xs text-slate-400">10-Year Cumulative Systemic Evaluation ($500B Allocated)</p>
                      </div>

                      {/* Overall Grade Card */}
                      <div className="flex items-center gap-3 bg-slate-900/90 border border-slate-700 px-4 py-2.5 rounded-xl">
                        <div className="text-right">
                          <div className="text-[10px] font-bold text-slate-400 uppercase">System Score</div>
                          <div className="text-2xl font-mono font-black text-emerald-400">
                            {activeGroup.result.overallScore}<span className="text-xs text-slate-500">/100</span>
                          </div>
                        </div>
                        <div className={`w-12 h-12 rounded-lg flex items-center justify-center font-black text-2xl shadow ${
                          activeGroup.result.grade === 'S' || activeGroup.result.grade === 'A' 
                            ? 'bg-emerald-600 text-white' 
                            : activeGroup.result.grade === 'B' 
                            ? 'bg-blue-600 text-white' 
                            : activeGroup.result.grade === 'C' 
                            ? 'bg-amber-600 text-white' 
                            : 'bg-red-600 text-white'
                        }`}>
                          {activeGroup.result.grade}
                        </div>
                      </div>
                    </div>

                    {/* Metric Gauge Highlights */}
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-4 pt-4 border-t border-slate-700/60">
                      <div className="bg-slate-900/60 p-2.5 rounded-lg border border-slate-800">
                        <div className="text-[10px] text-slate-400 font-medium">ER Wait Time</div>
                        <div className="text-lg font-bold text-slate-100 font-mono mt-0.5">
                          {activeGroup.result.finalYr.erWait} hrs
                        </div>
                        <div className="text-[10px] text-emerald-400 font-medium">
                          {activeGroup.result.finalYr.erWait < 11.5 ? `↓ ${(11.5 - activeGroup.result.finalYr.erWait).toFixed(1)} hrs` : 'No improvement'}
                        </div>
                      </div>

                      <div className="bg-slate-900/60 p-2.5 rounded-lg border border-slate-800">
                        <div className="text-[10px] text-slate-400 font-medium">Bed Blocking (ALC)</div>
                        <div className="text-lg font-bold text-slate-100 font-mono mt-0.5">
                          {activeGroup.result.finalYr.alcRate}%
                        </div>
                        <div className="text-[10px] text-emerald-400 font-medium">
                          {activeGroup.result.finalYr.alcRate < 22 ? `↓ ${(22 - activeGroup.result.finalYr.alcRate).toFixed(1)}%` : 'No improvement'}
                        </div>
                      </div>

                      <div className="bg-slate-900/60 p-2.5 rounded-lg border border-slate-800">
                        <div className="text-[10px] text-slate-400 font-medium">MD Burnout</div>
                        <div className="text-lg font-bold text-slate-100 font-mono mt-0.5">
                          {activeGroup.result.finalYr.burnout}%
                        </div>
                        <div className="text-[10px] text-emerald-400 font-medium">
                          {activeGroup.result.finalYr.burnout < 88 ? `↓ ${(88 - activeGroup.result.finalYr.burnout).toFixed(1)}%` : 'No improvement'}
                        </div>
                      </div>

                      <div className="bg-slate-900/60 p-2.5 rounded-lg border border-slate-800">
                        <div className="text-[10px] text-slate-400 font-medium">Public Approval</div>
                        <div className="text-lg font-bold text-slate-100 font-mono mt-0.5">
                          {activeGroup.result.finalYr.approval}%
                        </div>
                        <div className="text-[10px] text-emerald-400 font-medium">
                          {activeGroup.result.finalYr.approval > 34 ? `↑ ${(activeGroup.result.finalYr.approval - 34).toFixed(1)}%` : 'No improvement'}
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* 10-Year Trajectory Chart */}
                  <div className="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-xl">
                    <h3 className="text-sm font-bold text-white mb-4 flex items-center gap-2">
                      <span>📈</span> 10-Year Trend Trajectory
                    </h3>
                    <div className="h-64 w-full">
                      <ResponsiveContainer width="100%" height="100%">
                        <LineChart data={activeGroup.result.trajectory} margin={{ top: 10, right: 10, left: -20, bottom: 0 }}>
                          <CartesianGrid strokeDasharray="3 3" stroke="#334155" />
                          <XAxis dataKey="year" stroke="#94a3b8" fontSize={11} />
                          <YAxis stroke="#94a3b8" fontSize={11} />
                          <Tooltip contentStyle={{ backgroundColor: '#0f172a', borderColor: '#334155', borderRadius: '8px' }} />
                          <Line type="monotone" dataKey="systemHealth" name="System Health Index" stroke="#10b981" strokeWidth={3} dot={false} />
                          <Line type="monotone" dataKey="erWait" name="ER Wait Time (hrs)" stroke="#ef4444" strokeWidth={2} dot={false} />
                          <Line type="monotone" dataKey="alcRate" name="ALC Bed-Blocking (%)" stroke="#f59e0b" strokeWidth={2} dot={false} />
                          <Line type="monotone" dataKey="burnout" name="Doctor Burnout (%)" stroke="#a855f7" strokeWidth={2} dot={false} />
                        </LineChart>
                      </ResponsiveContainer>
                    </div>
                  </div>

                  {/* Audit Findings */}
                  <div className="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-xl space-y-3">
                    <h3 className="text-sm font-bold text-white mb-2 flex items-center gap-2">
                      <span>🔍</span> Strategic Audit Findings
                    </h3>
                    {activeGroup.result.insights.map((item, i) => (
                      <div 
                        key={i} 
                        className={`p-3.5 rounded-lg border text-xs leading-relaxed ${
                          item.type === 'positive' 
                            ? 'bg-emerald-950/40 border-emerald-800 text-emerald-200' 
                            : item.type === 'warning' 
                            ? 'bg-amber-950/40 border-amber-800 text-amber-200' 
                            : 'bg-red-950/40 border-red-800 text-red-200'
                        }`}
                      >
                        <div className="font-bold text-sm mb-1">{item.title}</div>
                        <div>{item.desc}</div>
                      </div>
                    ))}
                  </div>
                </div>
              ) : (
                <div className="bg-slate-800/40 border border-slate-800 rounded-xl p-12 text-center flex flex-col items-center justify-center min-h-[400px]">
                  <div className="w-16 h-16 rounded-full bg-slate-800 flex items-center justify-center text-3xl mb-4 border border-slate-700">
                    🏛️
                  </div>
                  <h3 className="text-lg font-bold text-white">No Simulation Selected</h3>
                  <p className="text-xs text-slate-400 max-w-sm mt-1 leading-relaxed">
                    Set up your team's budget allocation on the left panel and click "Run 10-Year Simulation" to generate the Auditor General's report.
                  </p>
                </div>
              )}
            </div>
          </main>

          {/* Facilitator Secret Optimal Modal */}
          {showOptimalModal && (
