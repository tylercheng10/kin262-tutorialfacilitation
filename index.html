<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canada Health Budget Simulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [groupName, setGroupName] = useState("Group 1");
      const [alloc, setAlloc] = useState({ doctor: 125, hospital: 125, complex: 125, postEr: 125 });
      const [results, setResults] = useState(null);
      const [showOptimal, setShowOptimal] = useState(false);

      const totalAllocated = alloc.doctor + alloc.hospital + alloc.complex + alloc.postEr;

      const runSimulation = () => {
        // Safe Simulation Scoring Logic
        const postErScore = Math.min(100, (alloc.postEr / 175) * 35);
        const complexScore = Math.min(100, (alloc.complex / 125) * 25);
        const doctorScore = Math.min(100, (alloc.doctor / 125) * 25);
        const hospitalScore = Math.min(100, (alloc.hospital / 75) * 15);

        const totalScore = Math.round(postErScore + complexScore + doctorScore + hospitalScore);

        let grade = "F";
        if (totalScore >= 90) grade = "S";
        else if (totalScore >= 80) grade = "A";
        else if (totalScore >= 70) grade = "B";
        else if (totalScore >= 60) grade = "C";
        else if (totalScore >= 50) grade = "D";

        setResults({
          score: totalScore,
          grade,
          erWait: Math.max(1.8, Math.round((8.5 - (alloc.postEr * 0.02) - (alloc.complex * 0.015)) * 10) / 10),
          alcBeds: Math.max(4, Math.round((22 - (alloc.postEr * 0.08)) * 10) / 10),
          burnout: Math.max(25, Math.round((78 - (alloc.doctor * 0.25)) * 10) / 10)
        });
      };

      return (
        <div class="max-w-4xl mx-auto p-6">
          <header class="flex justify-between items-center border-b border-slate-700 pb-4 mb-6">
            <div>
              <h1 class="text-2xl font-bold text-red-500">🇨🇦 Canada Health Budget Simulator</h1>
              <p class="text-sm text-slate-400">10-Year Allocation Model ($500B CAD Total)</p>
            </div>
            <button 
              onClick={() => setShowOptimal(!showOptimal)}
              class="px-3 py-1.5 bg-amber-600/30 text-amber-300 border border-amber-500/50 rounded text-sm hover:bg-amber-600/50"
            >
              {showOptimal ? "Hide Optimal Benchmark" : "Facilitator: Reveal Benchmark"}
            </button>
          </header>

          {showOptimal && (
            <div class="bg-amber-950/40 border border-amber-500/40 rounded-lg p-4 mb-6 text-amber-200 text-sm">
              <h3 class="font-bold text-amber-400 mb-1">💡 Facilitator Benchmark Strategy ($500B Total):</h3>
              <ul class="list-disc ml-5 space-y-1">
                <li><strong>Post-ER Care (ALC):</strong> $175B (35%) — Solves bed-blocking bottleneck</li>
                <li><strong>Medically Complex Patients:</strong> $125B (25%) — Suppresses ER inflows</li>
                <li><strong>Doctor Shortage:</strong> $125B (25%) — Primary care foundation</li>
                <li><strong>Hospital Space:</strong> $75B (15%) — Avoids acute bed lock-in</li>
              </ul>
            </div>
          )}

          {!results ? (
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-6">
              <div>
                <label class="block text-sm font-medium mb-1">Group / Team Name</label>
                <input 
                  type="text" 
                  value={groupName} 
                  onChange={(e) => setGroupName(e.target.value)}
                  class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white"
                />
              </div>

              <div class="space-y-4">
                <div class="flex justify-between text-sm font-bold">
                  <span>Total Budget Allocation:</span>
                  <span class={totalAllocated === 500 ? "text-green-400" : "text-amber-400"}>
                    ${totalAllocated}B / $500B CAD
                  </span>
                </div>

                {[
                  { key: 'postEr', label: '1. Lack of Places After ER (Post-Acute / LTC)' },
                  { key: 'complex', label: '2. Medically Complex Inflow (Community Care)' },
                  { key: 'doctor', label: '3. Doctor Shortage & Primary Care' },
                  { key: 'hospital', label: '4. Lack of Hospital Space (Acute Care)' },
                ].map(({ key, label }) => (
                  <div key={key} class="bg-slate-900/50 p-4 rounded-lg border border-slate-800">
                    <div class="flex justify-between mb-2 text-sm">
                      <span class="font-medium">{label}</span>
                      <span class="font-bold text-red-400">${alloc[key]}B</span>
                    </div>
                    <input 
                      type="range" 
                      min="0" 
                      max="300" 
                      step="5"
                      value={alloc[key]} 
                      onChange={(e) => setAlloc({ ...alloc, [key]: Number(e.target.value) })}
                      class="w-full accent-red-500"
                    />
                  </div>
                ))}
              </div>

              <button 
                onClick={runSimulation}
                class="w-full py-3 bg-red-600 hover:bg-red-700 font-bold rounded-lg transition"
              >
                Run 10-Year Simulation
              </button>
            </div>
          ) : (
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-6">
              <div class="flex items-center justify-between border-b border-slate-700 pb-4">
                <div>
                  <h2 class="text-xl font-bold text-white">Auditor General 10-Year Report: {groupName}</h2>
                  <p class="text-sm text-slate-400">System Performance Evaluation</p>
                </div>
                <div class="text-right">
                  <div class="text-4xl font-black text-red-500">{results.score}<span class="text-lg text-slate-400">/100</span></div>
                  <div class="text-sm font-bold text-slate-300">Grade: {results.grade}</div>
                </div>
              </div>

              <div class="grid grid-cols-3 gap-4">
                <div class="bg-slate-900 p-4 rounded-lg text-center">
                  <div class="text-xs text-slate-400">Avg ER Wait Time</div>
                  <div class="text-2xl font-bold text-slate-200">{results.erWait} hrs</div>
                </div>
                <div class="bg-slate-900 p-4 rounded-lg text-center">
                  <div class="text-xs text-slate-400">Bed Blocking (ALC)</div>
                  <div class="text-2xl font-bold text-slate-200">{results.alcBeds}%</div>
                </div>
                <div class="bg-slate-900 p-4 rounded-lg text-center">
                  <div class="text-xs text-slate-400">MD Burnout Rate</div>
                  <div class="text-2xl font-bold text-slate-200">{results.burnout}%</div>
                </div>
              </div>

              <button 
                onClick={() => setResults(null)}
                class="w-full py-2 bg-slate-700 hover:bg-slate-600 text-sm font-semibold rounded"
              >
                ← Test Another Group Allocation
              </button>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
